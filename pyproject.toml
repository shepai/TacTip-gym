[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tactip-gym"
version = "0.4.0"
description = "MuJoCo soft-body TacTip simulator and Gymnasium benchmark for tactile, visual and visuo-tactile sensing"
readme = "README.md"
authors = [
    {name = "Dexter Shepherd"}
]
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",            # tested on 3.3.7
    "gymnasium>=1.0,<2.0",    # tested on 1.4; SB3 requires <2
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.4,<3",   # Gymnasium 1.x support; code checked against 2.9
    "torch>=2.0",                  # SB3 2.9 itself needs torch>=2.8 and will pull it in
    "opencv-python",               # training videos, viewing camera images
    "tqdm",                        # progress bar in run()
    "rich",
    "pyyaml",                      # YAML experiment configs (JSON works without it)
    "matplotlib",                  # results charts, examples/demos/view_sensors.py
]
test = [
    "pytest",
]
docs = [                      # the documentation (docs/; Read the Docs uses docs/requirements.txt)
    "sphinx>=7.3",
    "myst-parser>=3.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]
legacy = [
    "dm_control",             # only for env.physics on the old base class
]

[project.scripts]
tactip-gym = "tactip_mujoco_gym.__main__:main"

# Readouts from other packages: add an entry point in their pyproject.toml, e.g.
# [project.entry-points."tactip_mujoco_gym.sensors"]
# my_sensor = "my_package.sensors:MySensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tactip_mujoco_gym = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
