# Read the Docs build configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# The pages are written in Markdown (MyST) and take their text from README.md, so the README
# and the documentation never disagree. The API reference is generated from the docstrings.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
